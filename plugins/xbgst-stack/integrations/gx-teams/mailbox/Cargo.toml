[package]
name = "xbgst-mailbox"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
filetime = "0.2"

[[bin]]
name = "xbgst-mailbox"
path = "src/main.rs"
