name: marketplace-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Run smoke-gates (no Grok CLI)
        env:
          SMOKE_SKIP_GROK: "1"
        run: |
          chmod +x scripts/smoke-gates.sh scripts/ship-check.sh \
            scripts/sync-livepatch-from-standalone.sh scripts/sync-livepatch.sh
          chmod +x plugins/xbgst-stack/livepatch/scripts/*.sh plugins/grok-build-livepatch/scripts/*.sh
          ./scripts/smoke-gates.sh
